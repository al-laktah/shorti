# Runs behind the server's shared Caddy proxy, which reaches the frontend as "shorti" on the "web" network
services:
  web:
    build: .
    restart: unless-stopped
    networks:
      default:
      web:
        aliases:
          - shorti
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    environment:
      # override it with SHORTI_DOMAIN in a .env file next to this one
      SHORTI_DOMAIN: ${SHORTI_DOMAIN:-shorti.al-laktah.com}
    networks:
      default:
        aliases:
          - shorti-api
    volumes:
      - shorti-data:/data

networks:
  web:
    external: true

volumes:
  shorti-data:
